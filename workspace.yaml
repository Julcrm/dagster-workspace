# Référence tous les projets via gRPC
# Chaque projet tourne dans son propre service Coolify sur le port 4000
load_from:
  - grpc_server:
      host: velib-lakehouse
      port: 4000
      location_name: velib_lakehouse
  # bluesky-streamhouse, branche B (Quix + DuckLake + dbt-duckdb). Le nom d'hôte est le
  # nom du service dans le compose du projet (alias réseau ajouté par Coolify)
  - grpc_server:
      host: bluesky-duckdb
      port: 4000
      location_name: bluesky_duckdb
  # Ajouter les futurs projets ici de la même façon
