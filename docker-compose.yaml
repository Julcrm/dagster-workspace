version: "3.8"

# =============================================================================
# Dagster Workspace — Docker Compose
# Services:
#   - dagster-webserver: Dagster UI + GraphQL API (port 3000)
#       * host port bound to BIND_IP (unset → 127.0.0.1; Tailscale IP → tailnet only)
#       * project containers reach it internally at http://dagster-webserver:3000
#   - dagster-daemon: scheduler, sensor runner, run launcher (no exposed port)
# Storage: PostgreSQL (external, injected via env vars)
# Network: coolify (external — shared with all project code servers)
# =============================================================================

services:
  # Serves the Dagster UI and handles API requests from the browser
  dagster-webserver:
    build: .
    container_name: dagster-webserver
    ports:
      # Never bind to a public IP
      - "${BIND_IP:-127.0.0.1}:3000:3000"
    environment:
      - DAGSTER_HOME=/opt/dagster/dagster_home
      - DAGSTER_POSTGRES_USER=${DAGSTER_POSTGRES_USER}
      - DAGSTER_POSTGRES_PASSWORD=${DAGSTER_POSTGRES_PASSWORD}
      - DAGSTER_POSTGRES_HOST=${DAGSTER_POSTGRES_HOST}
      - DAGSTER_POSTGRES_DB=${DAGSTER_POSTGRES_DB}
    # The UI and GraphQL API answer (no curl in python:slim)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/server_info', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - coolify
    restart: always

  # Runs schedules, sensors and launches pipeline runs in the background
  dagster-daemon:
    build: .
    container_name: dagster-daemon
    command: dagster-daemon run -w workspace.yaml
    environment:
      - DAGSTER_HOME=/opt/dagster/dagster_home
      - DAGSTER_POSTGRES_USER=${DAGSTER_POSTGRES_USER}
      - DAGSTER_POSTGRES_PASSWORD=${DAGSTER_POSTGRES_PASSWORD}
      - DAGSTER_POSTGRES_HOST=${DAGSTER_POSTGRES_HOST}
      - DAGSTER_POSTGRES_DB=${DAGSTER_POSTGRES_DB}
    # Recent daemon heartbeats in the instance storage (~4 s: it loads Dagster, hence
    # the 60 s interval)
    healthcheck:
      test: ["CMD", "dagster-daemon", "liveness-check"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 120s
    networks:
      - coolify
    restart: always
    depends_on:
      - dagster-webserver

networks:
  # Shared Coolify network — allows this service to reach project gRPC servers by container name
  coolify:
    external: true
    name: coolify
