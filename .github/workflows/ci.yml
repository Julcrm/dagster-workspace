name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker-compose.yaml
        run: docker compose -f docker-compose.yaml config --quiet

      # Every code location needs a host, a port and a unique name, or the webserver and
      # the daemon fail to load the whole workspace
      - name: Validate workspace.yaml
        run: |
          python3 - <<'PY'
          import sys
          import yaml

          entries = yaml.safe_load(open("workspace.yaml"))["load_from"]
          names = []
          for entry in entries:
              server = entry.get("grpc_server") or sys.exit(f"not a grpc_server: {entry}")
              missing = {"host", "port", "location_name"} - server.keys()
              if missing:
                  sys.exit(f"{server}: missing {sorted(missing)}")
              names.append(server["location_name"])
          if len(names) != len(set(names)):
              sys.exit(f"duplicate location names: {names}")
          yaml.safe_load(open("dagster.yaml"))
          print(f"{len(names)} code locations: {', '.join(names)}")
          PY

      # The image installs pinned Dagster and SQLAlchemy versions: an unpinned rebuild
      # once took the UI and the daemon down (2026-09-28)
      - name: Build the image
        run: docker build -t dagster-workspace:ci .

      - name: Check the Dagster CLIs in the image
        run: |
          docker run --rm dagster-workspace:ci dagster --version
          docker run --rm dagster-workspace:ci dagster-daemon --help > /dev/null

  deploy:
    name: Deploy to Coolify
    runs-on: ubuntu-latest
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # The Coolify API is only reachable through Tailscale: the runner joins the
    # tailnet as an ephemeral `tag:ci` node via workload identity federation (OIDC).
    permissions:
      contents: read
      id-token: write
    env:
      # Deployment is skipped (not failed) until the Coolify secrets exist
      DEPLOY_CONFIGURED: ${{ secrets.COOLIFY_WEBHOOK_URL != '' }}

    steps:
      - name: Skip notice
        if: env.DEPLOY_CONFIGURED != 'true'
        run: echo "::notice::Coolify deploy secrets not set, deployment skipped"

      - name: Join tailnet
        if: env.DEPLOY_CONFIGURED == 'true'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: 100.125.33.49

      - name: Trigger Coolify deployment
        if: env.DEPLOY_CONFIGURED == 'true'
        run: |
          curl -f --show-error --max-time 30 -X POST "${{ secrets.COOLIFY_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_WEBHOOK_SECRET }}"
